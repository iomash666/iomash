<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Carta de Amor · Pergamino con Fotos Mágicas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #2a1e12 0%, #3f2c1c 100%);
      font-family: 'Segoe UI', 'Georgia', 'Times New Roman', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Pantalla inicial */
    .intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    .intro-card {
      background: #fffaf0;
      background-image: radial-gradient(circle at 10% 20%, rgba(230, 190, 120, 0.15) 2%, transparent 2.5%);
      background-size: 35px 35px;
      max-width: 500px;
      width: 90%;
      padding: 2rem;
      border-radius: 48px;
      text-align: center;
      box-shadow: 0 30px 40px rgba(0,0,0,0.4);
      border: 1px solid #e9cf9e;
      animation: flotarSuave 2s infinite ease-in-out;
    }

    @keyframes flotarSuave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .intro-card p {
      font-size: 1.7rem;
      font-family: 'Georgia', cursive;
      color: #914d2c;
      margin-bottom: 2rem;
      font-weight: bold;
    }

    .intro-buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .btn-intro {
      background: #f5e2b2;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 5px 0 #b97f45;
      color: #4a2a14;
      width: 140px;
      transition: 0.1s;
    }

    .btn-intro:active {
      transform: translateY(2px);
    }

    .btn-move {
      background: #bc6f3c;
      color: white;
      box-shadow: 0 5px 0 #5e2a12;
      position: relative;
    }

    /* Pergamino */
    .pergamino-container {
      display: none;
      width: 100%;
      max-width: 750px;
      margin: 20px auto;
    }

    .scroll-card {
      background: #fffef7;
      background-image: radial-gradient(circle at 25% 40%, rgba(200, 165, 100, 0.1) 2%, transparent 2.2%);
      background-size: 28px 28px;
      border-radius: 32px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 1px #e9dbc3, 0 0 0 3px #b97f45;
      overflow: hidden;
      animation: despliegueRollo 0.8s ease-out forwards;
    }

    @keyframes despliegueRollo {
      0% { transform: scaleY(0.02) translateY(-60px); opacity: 0; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    .scroll-header {
      background: #f3e9d2;
      padding: 18px 20px 10px;
      text-align: center;
      border-bottom: 2px dashed #e2ca9b;
    }

    .scroll-header h2 {
      font-family: 'Georgia', cursive;
      font-size: 1.9rem;
      color: #b64926;
    }

    .content-scroll {
      padding: 25px 25px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .love-text {
      background: transparent;
      border: none;
      width: 100%;
      min-height: 180px;
      font-family: 'Georgia', 'Times New Roman', cursive;
      font-size: 1.2rem;
      line-height: 1.6;
      color: #2c1a0c;
      resize: vertical;
      outline: none;
      padding: 12px;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    .love-text:focus {
      background: rgba(255, 245, 215, 0.6);
    }

    /* GALERIA VERTICAL */
    .photos-area {
      margin: 15px 0 20px;
      border-top: 2px dotted #e7c894;
      padding-top: 20px;
    }

    .gallery-vertical {
      display: flex;
      flex-direction: column;
      gap: 25px;
      margin: 20px 0;
      align-items: center;
    }

    .photo-card {
      position: relative;
      background: linear-gradient(145deg, #f9efdb, #f3e5cd);
      border-radius: 32px;
      padding: 12px;
      box-shadow: 0 12px 20px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,200,0.8);
      width: 90%;
      max-width: 320px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid #e6cf9e;
      transform: scale(1);
    }

    .photo-card:active {
      transform: scale(0.98);
    }

    .photo-card img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 24px;
      display: block;
      background: #dcc88f;
      transition: 0.2s;
      pointer-events: none;
    }

    /* Marco decorativo animado (aparece al hacer click para ver foto completa) */
    .marco-completo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.3s ease;
      cursor: pointer;
    }

    .marco-completo.activo {
      visibility: visible;
      opacity: 1;
    }

    .foto-ampliada {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 32px;
      box-shadow: 0 0 0 6px #ffd89a, 0 0 0 12px #b64926, 0 20px 40px black;
      animation: latidoMarco 0.6s cubic-bezier(0.2, 1.2, 0.4, 1);
      transform-origin: center;
      background: #fbe9c3;
      padding: 8px;
    }

    @keyframes latidoMarco {
      0% { transform: scale(0.9); opacity: 0; }
      60% { transform: scale(1.02); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* EXPLOSIÓN DE "TE AMO" */
    .explosion-container {
      position: fixed;
      pointer-events: none;
      z-index: 3000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .te-amo-particle {
      position: absolute;
      font-size: 1.8rem;
      font-weight: bold;
      font-family: 'Georgia', cursive;
      color: #ff4d6d;
      text-shadow: 0 0 8px white, 0 0 12px gold;
      white-space: nowrap;
      animation: volarExplota 0.8s ease-out forwards;
      z-index: 3100;
    }

    @keyframes volarExplota {
      0% {
        transform: translate(0, 0) scale(0.8);
        opacity: 1;
      }
      50% {
        opacity: 1;
        transform: translate(var(--dx, 40px), var(--dy, -80px)) scale(1.2);
      }
      100% {
        transform: translate(var(--dxf, 80px), var(--dyf, -150px)) scale(0.6);
        opacity: 0;
      }
    }

    .corazon-particle {
      position: absolute;
      font-size: 2rem;
      animation: corazonVuela 0.9s ease-out forwards;
    }

    @keyframes corazonVuela {
      0% { transform: scale(0.5) translate(0,0); opacity: 1; }
      100% { transform: scale(1.2) translate(var(--cx, 50px), var(--cy, -100px)); opacity: 0; }
    }

    .music-panel {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background: #ebdfbe70;
      padding: 8px 15px;
      border-radius: 60px;
    }

    .music-toggle {
      background: #f4e1b0;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      font-size: 0.7rem;
      text-align: center;
      padding: 15px;
      color: #c2925b;
    }
  </style>
</head>
<body>

<!-- INTRO -->
<div id="introScreen" class="intro-screen">
  <div class="intro-card">
    <p>✨ "No me saldrá hacer una carta física<br> pero sí te puedo hacer mil de estas" ✨</p>
    <div class="intro-buttons">
      <button id="abrirBtn" class="btn-intro">📜 ABRIR</button>
      <button id="eliminarBtnIntro" class="btn-intro btn-move">🗑️ ELIMINAR</button>
    </div>
  </div>
</div>

<!-- PERGAMINO -->
<div id="pergaminoWrapper" class="pergamino-container">
  <div class="scroll-card">
    <div class="scroll-header">
      <h2>✧ Si te amo ok?? ✧</h2>
      <p>feita</p>
    </div>
    <div class="content-scroll">
      <textarea id="cartaTexto" class="love-text" placeholder="Escribe aquí tu mensaje de amor...">TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO  💖</textarea>
      
      <div class="photos-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span class="photos-title">📸 oztias✨ (toca la foto para verla grande )</span>
        </div>
        <div id="galeriaVertical" class="gallery-vertical"></div>
      </div>

      <div class="music-panel">
        <span>🎵 Música de fondo:</span>
        <button id="playMusicBtn" class="music-toggle">▶ Play</button>
        <button id="pauseMusicBtn" class="music-toggle">⏸ Pause</button>
        <input type="range" id="volumenSlider" min="0" max="1" step="0.05" value="0.4" style="width:120px;">
      </div>
      <footer>Hecho por tu negrito bonito akjhsdkhjas ❤️ </footer>
    </div>
  </div>
</div>

<!-- Marco para foto completa (lightbox animado) -->
<div id="marcoLightbox" class="marco-completo">
  <img id="imgAmpliada" class="foto-ampliada" alt="Foto completa">
</div>

<script>
  (function(){
    const introDiv = document.getElementById('introScreen');
    const abrirBtn = document.getElementById('abrirBtn');
    const eliminarBtn = document.getElementById('eliminarBtnIntro');
    const pergaminoContainer = document.getElementById('pergaminoWrapper');
    const galeriaDiv = document.getElementById('galeriaVertical');
    
    // Lightbox elementos
    const marcoLight = document.getElementById('marcoLightbox');
    const imgAmpliada = document.getElementById('imgAmpliada');
    
    // ---------- AUDIO cancion.mp3 (global) ----------
    let audioElement = null;
    let isAudioManuallyPaused = false;  // para no forzar play si el usuario pausó manualmente
    
    function initAudio() {
      if(audioElement) return audioElement;
      audioElement = new Audio('cancion.mp3');
      audioElement.loop = true;
      audioElement.volume = parseFloat(document.getElementById('volumenSlider').value);
      audioElement.onerror = () => console.log("No se encontró cancion.mp3, colócala en la misma carpeta");
      return audioElement;
    }
    
    function playMusic(force = false) {
      const audio = initAudio();
      // Si force es true (desde foto) y el usuario no ha pausado manualmente, reproducimos
      if(force && !isAudioManuallyPaused) {
        audio.play().catch(e => console.log("Autoplay bloqueado por navegador, pero se puede con play manual"));
      } 
      else if (!force && !isAudioManuallyPaused) {
        audio.play().catch(e => console.log(""));
      }
    }
    
    function pauseMusic() {
      if(audioElement) {
        audioElement.pause();
        isAudioManuallyPaused = true;
      }
    }
    
    function resetManualPause() {
      isAudioManuallyPaused = false;
    }
    
    // Para que el botón play reinicie la bandera manual
    document.getElementById('playMusicBtn').addEventListener('click', () => {
      resetManualPause();
      playMusic(false);
    });
    document.getElementById('pauseMusicBtn').addEventListener('click', pauseMusic);
    document.getElementById('volumenSlider').addEventListener('input', (e) => {
      if(audioElement) audioElement.volume = parseFloat(e.target.value);
    });
    
    // ---------- CARGAR FOTOS VERTICALES (img1,img2,img3,img4) ----------
    const imagenes = ['img1.jpg', 'img2.jpg', 'img3.jpg', 'img4.jpg'];
    
    // Función para mostrar la foto completa + reproducir automáticamente la canción
    function mostrarFotoCompleta(src) {
      imgAmpliada.src = src;
      marcoLight.classList.add('activo');
      // 🔥 NUEVO: al abrir la foto, reproducir música automáticamente (si no está sonando)
      // Reseteamos el flag de pausa manual para que se reproduzca con amor
      if(audioElement) {
        // si el usuario había pausado manualmente, al abrir foto se reanuda (porque es parte de la experiencia)
        isAudioManuallyPaused = false;
        audioElement.play().catch(e => {
          // si falla, inicializamos e intentamos de nuevo
          initAudio().play().catch(err => console.log("reproducción automática requiere interacción previa"));
        });
      } else {
        const newAudio = initAudio();
        isAudioManuallyPaused = false;
        newAudio.play().catch(e => console.log("necesitas interactuar primero con la página, prueba el botón play"));
      }
    }
    
    // Cerrar lightbox
    marcoLight.addEventListener('click', () => {
      marcoLight.classList.remove('activo');
    });
    
    // Función de EXPLOSIÓN con "TE AMO" y corazones
    function explosionAmor(event, fotoElement, imagenSrc) {
      const rect = fotoElement.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const explosionContainer = document.createElement('div');
      explosionContainer.classList.add('explosion-container');
      document.body.appendChild(explosionContainer);
      
      const numTeAmo = 10;
      const numCorazones = 14;
      const mensajes = ['❤️ TE AMO ❤️', '💖 TE AMO 💖', '✨ TE AMO ✨', '💕 TE AMO 💕', '💗 TE AMO 💗', '🌹 TE AMO 🌹'];
      
      for(let i = 0; i < numTeAmo; i++) {
        const span = document.createElement('div');
        const mensajeElegido = mensajes[Math.floor(Math.random() * mensajes.length)];
        span.innerText = mensajeElegido;
        span.classList.add('te-amo-particle');
        const dx = (Math.random() - 0.5) * 180;
        const dy = (Math.random() - 0.8) * 150 - 40;
        const dxf = dx * 1.2;
        const dyf = dy * 1.3 - 30;
        span.style.setProperty('--dx', dx + 'px');
        span.style.setProperty('--dy', dy + 'px');
        span.style.setProperty('--dxf', dxf + 'px');
        span.style.setProperty('--dyf', dyf + 'px');
        span.style.left = (centerX - 20) + 'px';
        span.style.top = (centerY - 20) + 'px';
        explosionContainer.appendChild(span);
      }
      
      for(let i = 0; i < numCorazones; i++) {
        const corazon = document.createElement('div');
        corazon.innerText = '❤️';
        corazon.classList.add('corazon-particle');
        const cx = (Math.random() - 0.5) * 160;
        const cy = (Math.random() - 0.7) * 140 - 50;
        corazon.style.setProperty('--cx', cx + 'px');
        corazon.style.setProperty('--cy', cy + 'px');
        corazon.style.left = (centerX - 15) + 'px';
        corazon.style.top = (centerY - 15) + 'px';
        corazon.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
        explosionContainer.appendChild(corazon);
      }
      
      fotoElement.style.transform = 'scale(0.95)';
      setTimeout(() => { fotoElement.style.transform = ''; }, 150);
      
      setTimeout(() => {
        explosionContainer.remove();
      }, 900);
    }
    
    // Cargar galería vertical
    function cargarGaleriaVertical() {
      galeriaDiv.innerHTML = '';
      let imagenesValidas = 0;
      
      imagenes.forEach((imgSrc, idx) => {
        const imgTest = new Image();
        imgTest.onload = () => {
          imagenesValidas++;
          crearTarjetaFoto(imgSrc, idx, false);
        };
        imgTest.onerror = () => {
          crearTarjetaFoto(null, idx, true);
          imagenesValidas++;
        };
        imgTest.src = imgSrc;
      });
    }
    
    function crearTarjetaFoto(src, index, isError = false) {
      const photoCard = document.createElement('div');
      photoCard.classList.add('photo-card');
      
      const img = document.createElement('img');
      if(!isError && src) {
        img.src = src;
        img.alt = `Recuerdo ${index+1}`;
      } else {
        img.src = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="100%25" height="100%25" fill="%23e6d5b3"/%3E%3Ctext x="50%25" y="50%25" font-size="20" fill="%23945e2f" text-anchor="middle" dy=".3em"%3E📷%3C/text%3E%3C/svg%3E';
        img.alt = 'Imagen no encontrada';
      }
      
      photoCard.appendChild(img);
      
      let pressTimer = null;
      let isLongPress = false;
      
      const verCompleta = (e) => {
        if(isLongPress) {
          isLongPress = false;
          return;
        }
        if(src && !isError) {
          mostrarFotoCompleta(src);
        } else {
          alert("Aún no has puesto esta foto 💌 súbela como " + imagenes[index]);
        }
      };
      
      const iniciarPresion = (e) => {
        isLongPress = false;
        pressTimer = setTimeout(() => {
          isLongPress = true;
          if(src && !isError) {
            explosionAmor(e, photoCard, src);
            if(navigator.vibrate) navigator.vibrate(100);
          } else {
            explosionAmor(e, photoCard, 'placeholder');
          }
        }, 500);
      };
      
      const cancelarPresion = () => {
        if(pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        setTimeout(() => { isLongPress = false; }, 100);
      };
      
      photoCard.addEventListener('mousedown', iniciarPresion);
      photoCard.addEventListener('mouseup', cancelarPresion);
      photoCard.addEventListener('mouseleave', cancelarPresion);
      photoCard.addEventListener('click', verCompleta);
      
      photoCard.addEventListener('touchstart', iniciarPresion, {passive: false});
      photoCard.addEventListener('touchend', cancelarPresion);
      photoCard.addEventListener('touchcancel', cancelarPresion);
      
      galeriaDiv.appendChild(photoCard);
    }
    
    // ---------- BOTÓN ELIMINAR QUE HUYE ----------
    function moveEliminarBtn() {
      const btn = eliminarBtn;
      if(!btn) return;
      const maxX = window.innerWidth - btn.offsetWidth - 40;
      const maxY = window.innerHeight - btn.offsetHeight - 80;
      const randomX = Math.max(10, Math.min(maxX, Math.random() * (maxX - 20) + 10));
      const randomY = Math.max(20, Math.min(maxY, Math.random() * (maxY - 30) + 30));
      btn.style.position = 'fixed';
      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
      btn.style.zIndex = '2000';
      btn.style.transition = 'left 0.08s linear, top 0.08s linear';
    }
    
    eliminarBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveEliminarBtn();
      const originalText = eliminarBtn.innerText;
      eliminarBtn.innerText = '😅 no!';
      setTimeout(() => { if(eliminarBtn) eliminarBtn.innerText = originalText; }, 400);
    });
    eliminarBtn.addEventListener('mouseenter', () => { moveEliminarBtn(); });
    
    // ---------- ABRIR CARTA ----------
    abrirBtn.addEventListener('click', () => {
      introDiv.style.opacity = '0';
      setTimeout(() => {
        introDiv.style.display = 'none';
        pergaminoContainer.style.display = 'block';
        if(eliminarBtn) {
          eliminarBtn.style.position = '';
          eliminarBtn.style.left = '';
          eliminarBtn.style.top = '';
        }
        // Pre-inicializar audio pero sin autoplay hasta que se abra una foto (evita bloqueos del navegador)
        initAudio();
        cargarGaleriaVertical();
      }, 400);
    });
    
    // Guardado automático del texto en localStorage
    const textoArea = document.getElementById('cartaTexto');
    if(localStorage.getItem('cartaTexto')) {
      textoArea.value = localStorage.getItem('cartaTexto');
    }
    textoArea.addEventListener('input', () => {
      localStorage.setItem('cartaTexto', textoArea.value);
    });
    
    galeriaDiv.innerHTML = '<div class="photo-card" style="opacity:0.7; text-align:center;"><div style="padding:30px;">🖼️ Cargando fotos especiales...</div></div>';
  })();
</script>
</body>
</html>
